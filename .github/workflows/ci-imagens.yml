name: CI e imagens de container

# Roda a suíte inteira e, só se ela passar, constrói e empurra as imagens dos quatro
# projetos deste repositório para o GHCR, publicando o docker-compose gerado pelo
# próprio AppHost como artefato da execução.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  # O extrator é WinForms (`net10.0-windows`, `WinExe`) e não compila em Linux — nem ele
  # nem o projeto de teste dele. Por isso a suíte é dividida por sistema operacional em
  # vez de rodar inteira num runner só: um `dotnet build` da solução em ubuntu falharia
  # nesses dois projetos. Os demais projetos de produção só têm `InternalsVisibleTo` para
  # o teste do extrator (não ProjectReference), então nada mais é arrastado para Windows.
  windows-tests:
    name: Testes do extrator (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      # `fetch-depth: 0` porque a versão publicada do extrator é **derivada** do histórico
      # (ver o passo de publicação abaixo); com o default, profundidade 1, não há histórico
      # para contar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Testes do extrator
        run: dotnet test tests/CosmosPro.ML.DemandForCast.Extractor.Tests/CosmosPro.ML.DemandForCast.Extractor.Tests.csproj --configuration Debug

      # O PATCH DA VERSÃO É DERIVADO DO HISTÓRICO, não lido do csproj.
      #
      # O csproj declara a **base** (`major.minor.patch`), e este passo soma quantos commits
      # tocaram o projeto do extrator desde o commit que introduziu aquela base. Mexeu no
      # extrator, o número anda e a publicação acontece; não mexeu, o número fica e a
      # publicação é pulada. Você continua mandando no minor e no major — bumpar a base para
      # `0.19.0` zera a contagem a partir dali.
      #
      # Isto substituiu uma guarda que reclamava de `<Version>` parado com código novo, e a
      # substituição é o ponto: o estado que ela detectava passou a ser **impossível** em vez
      # de detectável. O caso real foi `0.18.1` definida em 2d03534 com cc31b0e mexendo no
      # extrator depois, sem bump — as duas correções atravessaram sete deploys sem chegar ao
      # comprador, e nada no pipeline reclamava.
      #
      # A base do csproj continua valendo no build local (F5, publicação à mão): quem não
      # passa por aqui não tem histórico para contar, e um número parado no inner loop não
      # engana ninguém.
      #
      # Bumpe a base pelo MINOR, nunca pelo patch: `0.18.2` com 3 commits em cima já é
      # `0.18.5`, então cravar `0.18.5` na base faria duas árvores diferentes carregarem o
      # mesmo número.
      - name: Calcular a versão do extrator
        id: versao-extrator
        shell: pwsh
        run: |
          $csproj = "CosmosPro.ML.DemandForCast.Extractor/CosmosPro.ML.DemandForCast.Extractor.csproj"
          $base = (dotnet msbuild $csproj -getProperty:Version).Trim()
          if (-not $base) { throw "Nao foi possivel ler <Version> do csproj do extrator." }
          if ($base -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw "<Version> do extrator e '$base'; esperado major.minor.patch (ex.: 0.18.2)."
          }
          $maj, $min, $pat = [int]$Matches[1], [int]$Matches[2], [int]$Matches[3]

          # `git log -S` acha commits em que a CONTAGEM da string mudou -- o que inclui a
          # remocao dela, nao so a insercao. Aqui isso e inofensivo, e por uma invariante que
          # vale a pena registrar: `$base` foi lido do csproj em HEAD, entao a string esta
          # presente agora, e o commit mais recente que mexeu na contagem dela so pode ser um
          # que a INTRODUZIU (se fosse uma remocao, ela estaria ausente). Consultar uma versao
          # ANTIGA devolveria o commit que a apagou -- nao faca isso.
          #
          # Falhar aqui e deliberado: sem essa base nao ha como garantir que a versao
          # acompanha o codigo, e um fallback silencioso para a base reintroduziria exatamente
          # a falha que este passo existe para tornar impossivel.
          $bump = (git log -1 --format=%H -S "<Version>$base</Version>" -- $csproj | Out-String).Trim()
          if (-not $bump) {
            throw "Nao achei o commit que introduziu <Version>$base</Version> em $csproj. " +
                  "Se o historico foi reescrito, bumpe o minor da base para reancorar a contagem."
          }

          $extras = [int](git rev-list --count "$bump..HEAD" -- CosmosPro.ML.DemandForCast.Extractor | Out-String).Trim()
          $versao = "$maj.$min.$($pat + $extras)"

          Write-Host "base $base (commit $($bump.Substring(0,7))) + $extras commit(s) no extrator = $versao"
          "versao=$versao" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # O binário sai daqui porque é o único runner Windows do pipeline — e ele não vai
      # para o GHCR nem para dentro de nenhuma imagem: o comprador baixa o .exe pela
      # página da sessão, que faz stream do MinIO (ver README.md, "Publicar o extrator").
      # Self-contained porque a máquina que enxerga o PBS é servidor de farmácia, onde não
      # se instala runtime .NET para rodar um utilitário.
      - name: Publicar o extrator (win-x64, self-contained)
        shell: pwsh
        run: |
          # `-p:Version=` para o assembly e o manifesto contarem a MESMA versao: sem isto o
          # binario carregaria a base do csproj e o manifesto a derivada, e a tela mostraria
          # um numero diferente do que `ZipManifest.VersaoAtual()` le de dentro do .exe.
          $versao = "${{ steps.versao-extrator.outputs.versao }}"
          if (-not $versao) { throw "O passo anterior nao produziu a versao." }

          dotnet publish CosmosPro.ML.DemandForCast.Extractor -c Release -r win-x64 `
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$versao
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish do extrator falhou." }

          $publish = "CosmosPro.ML.DemandForCast.Extractor/bin/Release/net10.0-windows/win-x64/publish"
          $exe = Join-Path $publish "CosmosPro.ML.DemandForCast.Extractor.exe"
          if (-not (Test-Path $exe)) { throw "Publish nao gerou $exe." }

          New-Item -ItemType Directory -Force artefatos/extrator | Out-Null
          # Renomeado ja aqui para o nome que a apiservice procura no bucket: o operador
          # baixa o artefato e publica os dois arquivos sem renomear nada no caminho.
          Copy-Item $exe artefatos/extrator/extrator.exe

          # Minusculas porque e como o manifesto documenta o campo, e a tela mostra o
          # valor cru ao comprador conferir contra o Get-FileHash da maquina dele.
          $sha = (Get-FileHash artefatos/extrator/extrator.exe -Algorithm SHA256).Hash.ToLowerInvariant()

          [ordered]@{
            versao      = $versao
            sha256      = $sha
            publicadoEm = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content artefatos/extrator/manifesto.json -Encoding utf8

          Write-Host "extrator $versao sha256=$sha ($([math]::Round((Get-Item artefatos/extrator/extrator.exe).Length / 1MB)) MB)"

      - name: Publicar artefato do extrator
        uses: actions/upload-artifact@v4
        with:
          name: extrator
          path: artefatos/extrator/
          if-no-files-found: error

  linux-tests:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    # Teto do job acima da soma dos passos: os dois projetos que sobem o AppHost real
    # baixam SQL Server e MinIO e esperam os bancos ficarem saudáveis, e num
    # runner frio isso é medido em minutos, não em segundos.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Debug, não Release, de propósito: é a mesma configuração em que os testes rodam
      # logo abaixo (`dotnet test --configuration Debug`), e compilar em outra faria o
      # `--no-build` dos passos de integração/E2E não achar binário. Compilar os dois
      # projetos de teste que sobem o AppHost cobre, transitivamente, todos os projetos
      # de produção multiplataforma — inclusive o `Migrator`, que carrega o DACPAC do
      # próprio `bin` (o `.sqlproj` é ProjectReference dele).
      - name: Compilar (Debug)
        timeout-minutes: 20
        run: |
          dotnet build tests/CosmosPro.ML.DemandForCast.ApiService.IntegrationTests/CosmosPro.ML.DemandForCast.ApiService.IntegrationTests.csproj --configuration Debug
          dotnet build tests/CosmosPro.ML.DemandForCast.Web.E2ETests/CosmosPro.ML.DemandForCast.Web.E2ETests.csproj --configuration Debug

      # Os fixtures conversam com apiservice e webfrontend pelos endpoints HTTPS do
      # Aspire (`App.CreateHttpClient(..., endpointName: "https")`), então o Kestrel
      # precisa de um certificado para sequer abrir a porta e o HttpClient do teste
      # precisa confiar nele.
      #
      # `dotnet dev-certs https --trust` NÃO serve aqui: em Linux ele exporta para
      # `$HOME/.aspnet/dev-certs/trust` e depois verifica se esse diretório está no
      # `SSL_CERT_DIR`; como não está, ele avisa e sai com **código 4** — mesmo tendo
      # criado o certificado. Sob `set -e` isso derruba o job inteiro.
      #
      # O caminho abaixo é o que a documentação da Microsoft prescreve para CI: cria o
      # certificado, exporta em PEM para o armazenamento de CAs do sistema e roda
      # `update-ca-certificates`. Confiança pelo sistema, sem depender do código de
      # saída do `--trust`.
      #
      # Chromium não entra nesta conta: o fixture E2E abre as páginas com
      # `IgnoreHTTPSErrors = true`, então o navegador não precisa confiar em nada.
      - name: Certificado de desenvolvimento HTTPS
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools openssl
          dotnet dev-certs https
          # O `-ep` não cria o diretório de destino: sem este mkdir ele sai com código 3
          # ("Please create the target directory before exporting").
          sudo mkdir -p /usr/local/share/ca-certificates/aspnet
          sudo -E dotnet dev-certs https \
            -ep /usr/local/share/ca-certificates/aspnet/https.crt --format PEM
          sudo update-ca-certificates
          mkdir -p "$HOME/.aspnet/dev-certs/trust"
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      # Primeiro os testes puros: são minutos, não dezenas de minutos, e falham por
      # motivos que não têm nada a ver com infraestrutura. Rodá-los antes evita pagar o
      # download do SQL Server para descobrir um erro de lógica. O `bash -e` do runner
      # aborta no primeiro projeto vermelho.
      - name: Testes rápidos
        timeout-minutes: 25
        run: |
          for projeto in \
            tests/CosmosPro.ML.DemandForCast.Engine.Tests \
            tests/CosmosPro.ML.DemandForCast.OlapSchema.Tests \
            tests/CosmosPro.ML.DemandForCast.ApiService.Tests \
            tests/CosmosPro.ML.DemandForCast.Worker.Tests \
            tests/CosmosPro.ML.DemandForCast.Web.Tests \
            tests/CosmosPro.ML.DemandForCast.SyntheticData.Tests \
            tests/CosmosPro.ML.DemandForCast.Features.Tests \
            tests/CosmosPro.ML.DemandForCast.Forecasting.Tests \
            tests/CosmosPro.ML.DemandForCast.Purchasing.Tests \
            tests/CosmosPro.ML.DemandForCast.Migrator.Tests
          do
            nome=$(basename "$projeto")
            echo "::group::$nome"
            dotnet test "$projeto/$nome.csproj" --configuration Debug
            echo "::endgroup::"
          done

      # Baixa as imagens de infraestrutura antes dos testes que sobem o AppHost. Não é
      # cosmético: o fixture de integração espera no máximo 5 minutos a apiservice ficar
      # saudável, e num runner frio esse orçamento é disputado com o download de ~2 GB de
      # imagem. As tags espelham os padrões das integrações do Aspire — se um bump do
      # Aspire mudar alguma, o `|| true` deixa o download acontecer depois, dentro do
      # teste: custa tempo, não quebra o build.
      - name: Pré-baixar imagens de infraestrutura
        timeout-minutes: 15
        run: |
          for imagem in \
            mcr.microsoft.com/mssql/server:2022-latest \
            docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          do
            docker pull "$imagem" || true
          done

      # Os dois projetos abaixo sobem o AppHost real e se excluem mutuamente por um lock
      # de arquivo entre processos (AppHostExclusiveLock) — os containers do Aspire são
      # persistentes e compartilhados, então dois AppHosts vivos são um só ambiente com
      # dois donos. Ficam em passos separados e sequenciais justamente para o lock nunca
      # entrar em disputa: quem chega segundo já encontra o primeiro encerrado.
      #
      # Teto de 15 min contra uma medição, não contra o medo: a suíte roda em ~4 min com as
      # imagens já baixadas. Era 45, e isso é pior do que parece — um passo que pode ficar
      # 45 minutos sem imprimir nada é cancelado à mão antes de qualquer diagnóstico, e foi
      # o que aconteceu. Os tetos internos do fixture (6 min para subir, 5 para ficar
      # saudável, 5 no lock) devem estourar primeiro e dizer *o que* travou; este aqui é a
      # última linha de defesa, não a primeira.
      #
      # `--logger console;verbosity=normal` porque sem ele o resultado só aparece no fim: se
      # o processo não chega ao fim, o log não mostra nem os testes que passaram, e não dá
      # para saber se travou na subida do AppHost ou dentro de um teste.
      - name: Testes de integração
        timeout-minutes: 15
        run: dotnet test tests/CosmosPro.ML.DemandForCast.ApiService.IntegrationTests/CosmosPro.ML.DemandForCast.ApiService.IntegrationTests.csproj --configuration Debug --no-build --logger "console;verbosity=normal"

      # O fixture E2E já chama `playwright install chromium` sozinho, e isso baixa o
      # navegador — mas não as bibliotecas de sistema que ele carrega (libnss3, libatk,
      # libgbm e companhia). `--with-deps` é o que cobre essa parte, e é a razão de o
      # passo continuar existindo mesmo com a instalação feita pelo teste.
      - name: Dependências de sistema do Playwright
        timeout-minutes: 10
        run: pwsh tests/CosmosPro.ML.DemandForCast.Web.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # Mesmo teto e mesmo logger do passo de integração, e pelos mesmos motivos — este sobe
      # o AppHost real também, e ainda um Chromium por cima.
      - name: Testes E2E
        timeout-minutes: 15
        run: dotnet test tests/CosmosPro.ML.DemandForCast.Web.E2ETests/CosmosPro.ML.DemandForCast.Web.E2ETests.csproj --configuration Debug --no-build --logger "console;verbosity=normal"

  images:
    name: Imagens e artefatos de compose
    runs-on: ubuntu-latest
    needs: [linux-tests, windows-tests]
    timeout-minutes: 45

    permissions:
      contents: read
      # Necessário para o GITHUB_TOKEN embutido conseguir escrever no GHCR.
      packages: write

    env:
      REGISTRY_ENDPOINT: ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar a CLI do Aspire
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Versão da CLI do Aspire
        run: aspire --version

      # `${{ github.repository }}` é `procfit/MLDemandForcastPOC`, com maiúsculas, e o
      # GHCR só aceita nome de repositório em minúsculas — empurrar com maiúscula é
      # rejeitado no push, não na configuração. `${VAR,,}` do bash faz a conversão.
      - name: Repositório do registry em minúsculas
        run: echo "REGISTRY_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A imagem do worker é a única que não sai da base default do SDK: o treino carrega o
      # nativo do LightGBM, que depende de `libgomp.so.1`, e nenhuma imagem oficial do .NET
      # traz esse pacote. O porquê completo está em
      # CosmosPro.ML.DemandForCast.Worker/worker-base.Dockerfile.
      #
      # Este passo vem antes do `aspire do push` porque é insumo dele: o container publishing
      # do SDK vai **puxar** esta referência do registry ao montar a imagem do worker, e não
      # consulta o daemon local. Daí o push da base, e não só o build.
      #
      # A referência é lida do `.csproj` em vez de repetida aqui: ela já está definida lá,
      # em `ContainerBaseImage`, e duas cópias divergiriam no primeiro bump de major do
      # runtime — com o sintoma aparecendo só no treino, em produção. `-getProperty` faz o
      # MSBuild responder qual é, com o mesmo ambiente que o build vai usar.
      #
      # Contexto vazio (`- < arquivo`): o Dockerfile não tem COPY, então não há o que enviar
      # ao daemon.
      - name: Construir e empurrar a imagem base do worker
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          base=$(dotnet msbuild CosmosPro.ML.DemandForCast.Worker/CosmosPro.ML.DemandForCast.Worker.csproj \
                   -getProperty:ContainerBaseImage | tr -d '[:space:]')
          if [ -z "$base" ]; then
            echo "::error::Não foi possível ler ContainerBaseImage do .csproj do worker."
            exit 1
          fi
          echo "Imagem base do worker: $base"
          docker build -t "$base" - < CosmosPro.ML.DemandForCast.Worker/worker-base.Dockerfile
          docker push "$base"

      # Cada imagem recebe duas tags: `sha-<7 primeiros do commit>`, imutável, e o nome da
      # branch, móvel.
      #
      # A imutável é a que responde "qual commit está rodando?" sem cruzar com o histórico do
      # CI. `IMAGE_TAG` é o que o AppHost lê para trocar a tag do `aspire do push`.
      #
      # A móvel sai de `GITHUB_REF_NAME`, e não de um `main` cravado, para um
      # `workflow_dispatch` numa branch de feature não sobrescrever a tag que a produção
      # segue. `tr` troca tudo que não é `[A-Za-z0-9_.-]` por `-` porque nome de branch aceita
      # `/` e tag de imagem não (`feat/extrator-cli` → `feat-extrator-cli`); `printf` em vez de
      # `echo` para a quebra de linha final não virar um `-` no fim da tag.
      - name: Calcular as tags das imagens
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          tag_movel=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')
          echo "IMAGE_TAG_MOVEL=$tag_movel" >> "$GITHUB_ENV"

      # Constrói e empurra as quatro imagens do repositório (db-migrator, apiservice,
      # webfrontend, worker). `REGISTRY_ENDPOINT`/`REGISTRY_REPOSITORY` são lidos
      # pelos parâmetros `registryEndpoint`/`registryRepository` do AppHost, e `IMAGE_TAG`
      # pelo callback `WithImagePushOptions` — sem ela a tag seria o default do Aspire.
      # `--non-interactive` garante que um parâmetro sem valor vire erro em vez de um
      # prompt que travaria o job até o timeout.
      #
      # Retenta **só** quando o GHCR estrangula. Um merge para `main` falhou aqui com
      # `denied: permission_denied ... 403` e corpo dizendo "You have exceeded a secondary
      # rate limit": build inteiro verde, testes verdes, e o run perdido no envio. Limite
      # secundário cede ao **tempo**, não à insistência, daí a espera crescente.
      #
      # A retentativa é condicionada à assinatura do erro, e não aplicada a qualquer falha,
      # de propósito: um erro de build real repetido três vezes custaria os minutos de espera
      # somados e ainda esconderia a causa atrás de duas tentativas idênticas. `pipefail` é
      # obrigatório aqui — sem ele o `tee` mascara o código de saída do `aspire` e o passo
      # passa mesmo quebrado.
      - name: Construir e empurrar as imagens
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          espera=120
          for tentativa in 1 2 3; do
            if aspire do push \
                 --apphost CosmosPro.ML.DemandForCast.AppHost/CosmosPro.ML.DemandForCast.AppHost.csproj \
                 --non-interactive 2>&1 | tee push.log
            then
              exit 0
            fi

            if ! grep -qiE 'secondary rate limit|too many requests|toomanyrequests|\b429\b' push.log; then
              echo "::error::O push falhou por um motivo que não é limite de taxa do registry — ver o log acima."
              exit 1
            fi

            if [ "$tentativa" = 3 ]; then
              echo "::error::O GHCR estrangulou o push nas três tentativas. Espere alguns minutos e reexecute só este job."
              exit 1
            fi

            echo "::warning::GHCR estrangulou o push (tentativa $tentativa/3). Aguardando ${espera}s antes de tentar de novo."
            sleep "$espera"
            espera=$((espera * 2))
          done

      # Nenhum teste da suíte pode pegar a classe de defeito que este passo pega, e não é por
      # falta de cobertura: `Forecasting.Tests` e `Purchasing.Tests` treinam LightGBM de
      # verdade, em Linux, e passam — porque o runner do GitHub tem `libgomp1` instalado. O
      # que quebrou em produção foi a **imagem**, que não tem. Entre o teste verde e o destino
      # existe um artefato que nenhum teste abre; é ele que este passo abre.
      #
      # São duas sondas, e a segunda nasceu de um incidente que a primeira não pegou. O `ldd`
      # do nativo do LightGBM cobre "Unable to load shared library 'lib_lightgbm'", que o
      # comprador viu no meio de um treino. Só que a primeira versão deste passo **passou** numa
      # imagem que nem iniciava: a base fixada por `ContainerBaseImage` trazia o nativo e não
      # trazia o framework do ASP.NET Core, e o processo saía em dois segundos com exit 150.
      # Abrir o artefato pela metade dá exatamente o conforto que um smoke não deveria dar, daí
      # a checagem de frameworks vir antes.
      #
      # Não achar o `.so` é falha, não sucesso: um teste de dependência num arquivo
      # inexistente não acha nada faltando, e sem esta guarda uma mudança de layout do
      # publish faria o passo passar afirmando exatamente o que deixou de verificar.
      #
      # O que ele **não** faz: barrar o push. `aspire do push` constrói e empurra na mesma
      # operação, então quando esta sonda roda a imagem já está no GHCR. O que a falha aqui
      # impede é que alguém a **use**: a tag móvel não avança e o artefato de compose não é
      # publicado, então nada no destino passa a apontar para ela.
      - name: Smoke da imagem do worker (frameworks e dependências nativas)
        timeout-minutes: 10
        shell: bash
        run: |
          imagem="$REGISTRY_ENDPOINT/$REGISTRY_REPOSITORY/worker:$IMAGE_TAG"
          echo "Verificando $imagem"
          docker run --rm --entrypoint sh "$imagem" -c '
            set -e

            # Frameworks primeiro, porque é a falha que mata mais rápido e mais cedo: o worker
            # referencia ServiceDefaults, que declara FrameworkReference de
            # Microsoft.AspNetCore.App. Numa base que só traz Microsoft.NETCore.App o processo
            # sai em dois segundos com exit 150 ("No frameworks were found"), a cada start, para
            # sempre. Foi assim que a fila ficou dois dias parada.
            dotnet --list-runtimes
            for framework in Microsoft.NETCore.App Microsoft.AspNetCore.App; do
              if ! dotnet --list-runtimes | grep -q "^$framework 10\."; then
                echo "framework ausente na imagem: $framework 10.x"
                exit 1
              fi
            done
            echo "ok: frameworks presentes"

            so=$(find /app -name "lib_lightgbm.so" 2>/dev/null | head -1)
            if [ -z "$so" ]; then
              echo "lib_lightgbm.so nao esta na imagem — o layout do publish mudou?"
              exit 1
            fi
            echo "nativo: $so"
            ldd "$so"
            if ldd "$so" | grep -q "not found"; then
              echo "dependencia nativa nao resolvida na imagem"
              exit 1
            fi
            echo "ok: todas as dependencias nativas resolvidas"
          '

      # O Aspire empurra **uma** tag por imagem, então a móvel é acrescentada aqui, em cima do
      # que o passo anterior já publicou.
      #
      # `buildx imagetools create`, e não `docker tag` + `docker push`: a tag é criada a partir
      # do manifest **que já está no registry**, sem reenviar nada. O par tag+push subia as
      # camadas de novo (o registry deduplica, mas cada blob ainda custa requisição), o que
      # dobrava o número de chamadas ao GHCR por execução — oito referências em vez de quatro,
      # justamente o padrão de rajada que dispara o limite secundário que derrubou um run.
      #
      # A lista de serviços é derivada do daemon local, e não escrita à mão: hoje são quatro,
      # mas um quinto recurso acrescentado ao AppHost receberia a tag imutável pelo callback e
      # ficaria sem a móvel — em silêncio, e só se descobriria no destino apontando para uma
      # tag que nunca se move. Zero imagens é erro, não lista vazia: significa que o push
      # anterior não produziu o que este passo pressupõe.
      - name: Adicionar a tag móvel às imagens
        timeout-minutes: 15
        shell: bash
        run: |
          referencia="$REGISTRY_ENDPOINT/$REGISTRY_REPOSITORY/*:$IMAGE_TAG"
          imagens=$(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=$referencia")
          if [ -z "$imagens" ]; then
            echo "::error::Nenhuma imagem local casa com $referencia — o passo de push não construiu o que este passo espera."
            exit 1
          fi
          for imagem in $imagens; do
            movel="${imagem%:*}:$IMAGE_TAG_MOVEL"
            docker buildx imagetools create --tag "$movel" "$imagem"
          done

      - name: Gerar docker-compose.yaml e .env
        timeout-minutes: 10
        run: aspire publish --project CosmosPro.ML.DemandForCast.AppHost/CosmosPro.ML.DemandForCast.AppHost.csproj --output-path ./aspire-output --non-interactive

      # `include-hidden-files` porque o `.env` começa com ponto e sem isso ele fica fora
      # do artefato — e sem o `.env` o compose não sobe. Ele é enviado **em branco**, do
      # jeito que o `aspire publish` gera: preencher é trabalho do operador, no destino.
      - name: Publicar os artefatos de deploy
        uses: actions/upload-artifact@v4
        with:
          name: aspire-compose
          path: ./aspire-output/
          retention-days: 30
          include-hidden-files: true

      # O compose do destino é `raw` colado à mão no Dokploy, e essa cópia manual já custou
      # duas vezes: uma correção de `pull_policy` viveu como edição no YAML de lá até a
      # regeneração seguinte a apagar em silêncio, e um parâmetro novo do AppHost virou linha
      # nova no compose que ninguém colou — a variável ficava preenchida no Environment e o
      # processo não recebia nada, com a falha aparecendo como "não configurado" em vez de
      # erro.
      #
      # Este passo transforma as duas em build vermelho. `deploy/docker-compose.yaml` é o
      # registro do que o AppHost gera; se o gerado agora diverge dele, alguma coisa mudou na
      # topologia e o YAML do Dokploy está velho.
      #
      # Comparação byte a byte, e não semântica, de propósito: se um bump do Aspire mudar o
      # formato do YAML, o vermelho é exatamente o sinal que se quer — a ferramenta mudou o
      # que roda em produção, e alguém precisa olhar. Não é intermitência; é notícia.
      #
      # Não é preciso rodar nada localmente para consertar: o passo imprime o diff e o
      # arquivo regenerado sai no artefato `aspire-compose` desta execução, pronto para
      # commitar e para colar no Dokploy.
      - name: Conferir se o compose do repositório está atual
        shell: bash
        run: |
          set -uo pipefail
          registrado=deploy/docker-compose.yaml
          gerado=./aspire-output/docker-compose.yaml

          if [ ! -f "$registrado" ]; then
            echo "::error::$registrado não existe. Commite o compose gerado por 'aspire publish'."
            exit 1
          fi

          # O diff vai para variavel, e nao para arquivo no workspace: um `compose.diff`
          # solto na raiz reaparece como arquivo nao rastreado para quem rodar este trecho
          # na mao, e ja foi commitado por acidente uma vez.
          if saida=$(diff -u "$registrado" "$gerado"); then
            echo "Compose do repositório está atual."
            exit 0
          fi

          # As variáveis vêm do próprio compose (`${VAR}`), e não do `.env`: todo parâmetro do
          # AppHost aparece nas duas pontas, e ler do compose dispensa um segundo arquivo
          # commitado só para isso.
          vars_antes=$(grep -o '\${[A-Z_][A-Z_0-9]*}' "$registrado" | tr -d '${}' | sort -u)
          vars_agora=$(grep -o '\${[A-Z_][A-Z_0-9]*}' "$gerado"     | tr -d '${}' | sort -u)
          novas=$(comm -13 <(echo "$vars_antes") <(echo "$vars_agora"))
          sumidas=$(comm -23 <(echo "$vars_antes") <(echo "$vars_agora"))

          echo "::error::O compose gerado pelo AppHost diverge de $registrado — o YAML colado no Dokploy está velho. Commite o arquivo regenerado (está no artefato 'aspire-compose' desta execução) e recole no Dokploy no próximo deploy."

          if [ -n "$novas" ]; then
            echo "::error::VARIÁVEL NOVA no compose: $(echo $novas). Preencha o valor no Environment do Dokploy ANTES de deployar — sem isso o serviço sobe com a variável vazia, e a falha não aparece como erro."
          fi
          if [ -n "$sumidas" ]; then
            echo "::warning::Variável que saiu do compose: $(echo $sumidas). Pode sair do Environment do Dokploy."
          fi

          echo "::group::diff (registrado -> gerado)"
          echo "$saida"
          echo "::endgroup::"
          exit 1

  # Publica o extrator no destino sem passar pela UI: era o único artefato do pipeline que
  # exigia trabalho manual a cada release — baixar o `.zip` da página do Actions, logar na
  # Web como PowerUser e subi-lo em /admin/extrator.
  #
  # NÃO depende de `images` nem faz deploy: o `.exe` não viaja em imagem nenhuma, e o deploy
  # do backend continua sendo um clique no Dokploy (`autoDeploy: false`, com descrição
  # escrita à mão a cada release — é portão humano sobre um deploy que aplica DACPAC e EF
  # migrations em banco com dado real, e não é para automatizar daqui).
  #
  # Publicar antes de o backend novo subir é seguro por desenho do contrato de import:
  # entrada desconhecida no ZIP nunca é validada nem carregada, arquivo novo entra como
  # `OptionalFiles` e coluna é conferida por nome. Foi assim que o `catalogo_eans.csv` da
  # 0.18.0 conviveu com o backend anterior. Só uma mudança **destrutiva** de contrato
  # (renomear ou remover coluna obrigatória) exigiria ordenar as duas coisas — e essa não
  # sai sem alguém decidir.
  #
  # `needs: linux-tests` não é por artefato, é por mérito: um extrator não vai para a mão do
  # comprador a partir de um commit cuja suíte do backend está vermelha.
  publicar-extrator:
    name: Publicar o extrator no destino
    runs-on: ubuntu-latest
    needs: [windows-tests, linux-tests]
    timeout-minutes: 20
    # Só de `main`: um `workflow_dispatch` numa branch de feature não publica executável para
    # cliente, pelo mesmo motivo que a tag móvel das imagens sai de `GITHUB_REF_NAME`.
    if: github.ref == 'refs/heads/main'

    env:
      # A URL fica em `vars`, não em `secrets`, de propósito: o GitHub mascara valor de
      # secret no log, e uma URL mascarada torna o log inútil justamente quando ele é
      # necessário — "não consegui falar com ***" não diz com quem o job tentou falar. Ela
      # não é segredo (é o domínio público da Web); o token é.
      EXTRATOR_PUBLISH_URL: ${{ vars.EXTRATOR_PUBLISH_URL }}
      EXTRATOR_PUBLISH_TOKEN: ${{ secrets.EXTRATOR_PUBLISH_TOKEN }}

    steps:
      # Sem `actions/checkout`: este job não lê o repositório. O que ele publica vem do
      # artefato, e a versão vem do manifesto que o `windows-tests` escreveu — ela é derivada
      # do histórico lá, onde o histórico existe.
      - name: Baixar o par exe+manifesto
        uses: actions/download-artifact@v4
        with:
          name: extrator
          path: artefatos/extrator

      # Sai antes de qualquer chamada de rede quando o destino não está configurado: um
      # ambiente (ou um fork) sem as duas entradas não tem por que ficar vermelho por causa
      # de uma automação que não pediu. A publicação pela UI continua existindo.
      - name: Conferir configuração do destino
        id: destino
        run: |
          set -euo pipefail
          if [ -z "${EXTRATOR_PUBLISH_URL:-}" ] || [ -z "${EXTRATOR_PUBLISH_TOKEN:-}" ]; then
            echo "::notice::Publicação automática do extrator não configurada (falta a variável EXTRATOR_PUBLISH_URL ou o secret EXTRATOR_PUBLISH_TOKEN). O artefato 'extrator' continua nesta execução para publicação manual em /admin/extrator."
            echo "configurado=nao" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=sim" >> "$GITHUB_OUTPUT"
          fi

      # O portão que faz a diferença entre "publicar quando há release" e "publicar a cada
      # push": o binário muda em TODO build mesmo sem mudança no extrator (o SDK anexa o
      # commit ao InformationalVersion, então o SHA-256 muda), enquanto `<Version>` fica
      # parado. Publicar por push encheria a tela do comprador de "versão 0.18.1" com
      # checksum diferente a cada vez — e o checksum é a promessa que ele confere com
      # Get-FileHash na máquina dele.
      #
      # A consulta usa os STATUS para distinguir situações que um 404 juntaria numa só, e é
      # por isso que a rota responde 200 com campos nulos quando nada foi publicado (ver
      # ExtratorEndpoints.VersaoPublicadaAsync):
      #   200 -> a Web no ar tem a rota e respondeu;
      #   404 -> a Web no ar é anterior ao commit que criou a rota;
      #   401 -> o token do destino não é o deste secret;
      #   503 -> o destino não tem token configurado (env var vazia no .env).
      - name: Comparar a versão deste build com a que está no ar
        if: steps.destino.outputs.configurado == 'sim'
        id: versoes
        run: |
          set -euo pipefail

          versao=$(jq -r '.versao // empty' artefatos/extrator/manifesto.json)
          sha=$(jq -r '.sha256 // empty' artefatos/extrator/manifesto.json)
          if [ -z "$versao" ] || [ -z "$sha" ]; then
            echo "::error::O manifesto.json do artefato não declara versao/sha256."
            exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # `) || codigo="000"` em vez de `|| echo "000"` dentro da substituicao: um curl
          # que falha no meio (timeout, conexao cortada) ainda imprime o %{http_code}
          # parcial, e o echo concatenaria os dois -- "200000" nao casa com nenhum ramo do
          # `case` e o job culparia um codigo que o servidor nunca devolveu.
          codigo=$(curl -sS --max-time 60 -o no-ar.json -w '%{http_code}' \
                     -H "Authorization: Bearer $EXTRATOR_PUBLISH_TOKEN" \
                     "$EXTRATOR_PUBLISH_URL/extrator/publicacao") || codigo="000"

          case "$codigo" in
            200) ;;
            401) echo "::error::O destino recusou o token (401). O secret EXTRATOR_PUBLISH_TOKEN e a env var EXTRATOR_PUBLISH_TOKEN do destino não são o mesmo valor."; exit 1 ;;
            404) echo "::error::A rota /extrator/publicacao não existe em $EXTRATOR_PUBLISH_URL (404). A Web no ar é anterior ao commit que a criou — publique este backend antes."; exit 1 ;;
            503) echo "::error::O destino está sem token de publicação (503). Preencha EXTRATOR_PUBLISH_TOKEN no Environment do Dokploy e redeploye."; exit 1 ;;
            000) echo "::error::Não foi possível falar com $EXTRATOR_PUBLISH_URL."; exit 1 ;;
            *)   echo "::error::Resposta inesperada ($codigo) de $EXTRATOR_PUBLISH_URL/extrator/publicacao:"; cat no-ar.json; exit 1 ;;
          esac

          no_ar=$(jq -r '.versao // empty' no-ar.json)
          echo "no_ar=$no_ar" >> "$GITHUB_OUTPUT"
          echo "Versão no ar: ${no_ar:-<nenhuma>} | versão deste build: $versao"

          if [ "$no_ar" = "$versao" ]; then
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi

      # Não há guarda de bump aqui, e a ausência é o ponto: a versão do artefato é
      # DERIVADA do histórico no `windows-tests`, então "código novo com versão parada"
      # deixou de ser um estado possível. Antes existia um passo que o detectava e ficava
      # vermelho; ele saiu junto com a causa.
      - name: Extrator já publicado nesta versão
        if: steps.destino.outputs.configurado == 'sim' && steps.versoes.outputs.publicar == 'nao'
        run: echo "::notice::Extrator ${{ steps.versoes.outputs.versao }} já está no ar; nada publicado."

      # `--data-binary` e não `-F`: a rota recebe o ZIP no corpo cru (ver
      # ExtratorEndpoints.PublicarAsync). Quem valida o pacote, exige os dois arquivos e
      # RECALCULA o SHA-256 é a apiservice — este passo não repete nada disso, só confere no
      # fim se o que ficou no ar é o que ele mandou.
      #
      # O ZIP é montado aqui, com os dois arquivos na raiz, porque o artefato chega
      # descompactado do `download-artifact` (quem empacota é a UI do Actions).
      - name: Publicar
        if: steps.destino.outputs.configurado == 'sim' && steps.versoes.outputs.publicar == 'sim'
        run: |
          set -euo pipefail
          cd artefatos/extrator
          zip -q -j ../../extrator.zip extrator.exe manifesto.json
          cd ../..
          ls -lh extrator.zip

          codigo=$(curl -sS --max-time 900 -X POST -o publicado.json -w '%{http_code}' \
                     -H "Authorization: Bearer $EXTRATOR_PUBLISH_TOKEN" \
                     -H "Content-Type: application/zip" \
                     --data-binary @extrator.zip \
                     "$EXTRATOR_PUBLISH_URL/extrator/publicacao") || codigo="000"

          if [ "$codigo" != "200" ]; then
            echo "::error::A publicação falhou ($codigo):"
            cat publicado.json || true
            exit 1
          fi

          # Confere as duas pontas, e não só o 200: o SHA que volta é o que o servidor
          # RECALCULOU do executável que gravou no bucket. Se ele bate com o do manifesto
          # deste run, o binário desta execução é o que o comprador vai baixar — nem outro
          # arquivo, nem um corpo truncado no caminho.
          versao_no_ar=$(jq -r '.versao // empty' publicado.json)
          sha_no_ar=$(jq -r '.sha256 // empty' publicado.json)

          if [ "$versao_no_ar" != "${{ steps.versoes.outputs.versao }}" ] \
             || [ "$sha_no_ar" != "${{ steps.versoes.outputs.sha }}" ]; then
            echo "::error::O destino confirmou versao=$versao_no_ar sha=$sha_no_ar, diferente do enviado (versao=${{ steps.versoes.outputs.versao }} sha=${{ steps.versoes.outputs.sha }})."
            exit 1
          fi

          echo "::notice::Extrator $versao_no_ar publicado em $EXTRATOR_PUBLISH_URL (sha256=$sha_no_ar)."
